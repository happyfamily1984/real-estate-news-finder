# APK 클라우드 빌드: 테스트 → 화면 스크린샷 → 서명된 APK 빌드 → GitHub Releases에 게시
name: android

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      release:
        description: 'Releases에 출시할까요?'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: 테스트 + 화면 스크린샷
        run: ./gradlew testDebugUnitTest -Proborazzi.test.record=true

      - name: APK 빌드
        run: |
          # 버전 번호는 계속 커져야 덮어쓰기 설치가 됨 (100 + 실행 번호)
          export VERSION_CODE=$((100 + ${{ github.run_number }}))
          export VERSION_NAME=1.0.${{ github.run_number }}
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../real-estate-news-finder.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: android/app/build/screens/

      # 화면·카드 이미지 스크린샷을 screens 브랜치에 올려 바로 확인할 수 있게 함 (커밋 1개로 덮어씀)
      - name: 스크린샷 게시
        if: always()
        run: |
          cd app/build/screens || exit 0
          git init -q -b screens
          git config user.name "real-estate-news-finder-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "screens $(date -u +%FT%TZ)" || exit 0
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screens

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: real-estate-news-finder.apk

      # 자동 출시하지 않음: Actions > android > Run workflow 에서 'release' 체크했을 때만 출시
      - name: Releases에 게시
        if: github.event_name == 'workflow_dispatch' && inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 부동산뉴스파인더 1.0.${{ github.run_number }}
          make_latest: true
          body: |
            휴대폰에서 아래 **real-estate-news-finder.apk** 를 눌러 설치하세요.
            (처음 설치 시 "출처를 알 수 없는 앱 설치"를 허용해야 합니다.)
          files: real-estate-news-finder.apk
