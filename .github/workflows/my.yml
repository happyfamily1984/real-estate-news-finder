# 내 단지 수집: 메인 단지(config/main-complexes.json)의 실거래 분석 + 법원경매 물건 + 네이버 매물(호가)을 모아
# `store` 브랜치의 main/my.json 으로 올립니다. 앱의 '내 단지' 탭과 보고서가 이 자료를 씁니다. 자세한 내용: docs/my-data.md
name: my

on:
  schedule:
    - cron: '23 */3 * * *'
    # 매일 10:35 (한국 시각): 10시에 받은 네이버 매물이 다 들어왔는지 확인하고 다시 계산
    - cron: '35 1 * * *'
  # 네이버 매물 파일이 들어오면 바로 다시 계산
  push:
    branches: [ccr-63d315cd-vo3531]
    paths: ['inbox/**', 'config/**']
  workflow_dispatch:
    inputs:
      regions:
        description: '더 모을 시군구 (쉼표로 여러 곳. 예: 강남구,성남시 분당구). 비우면 메인 단지만'
        required: false
      months:
        description: '최근 몇 달'
        default: '6'
      types:
        description: 'trade(매매), rent(전월세)'
        default: 'trade,rent'

permissions:
  contents: write

concurrency:
  group: my
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 저장소 불러오기
        run: |
          mkdir -p store-out
          if git fetch --depth=1 origin store 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C store-out
          fi

      - name: 메인 단지 (실거래 분석 + 경매 + 네이버 매물)
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        run: node collector/collect.js main

      - name: 지역 수집
        if: github.event_name == 'workflow_dispatch' && inputs.regions != ''
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
          REGIONS: ${{ inputs.regions }}
          MONTHS: ${{ inputs.months }}
          TYPES: ${{ inputs.types }}
        run: node collector/collect.js molit --regions "$REGIONS" --months "$MONTHS" --types "$TYPES"

      - name: store 브랜치에 올리기
        run: |
          cd store-out
          git init -q -b store
          git config user.name "real-estate-news-finder-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "store $(date -u +%FT%TZ)"
          # 히스토리가 쌓이지 않도록 커밋 1개짜리 브랜치로 덮어씀
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" store
